# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Mutation Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mutant:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Record per-test coverage
        run: bin/rails db:test:prepare test
      - name: Run Mutant
        run: bundle exec mutant run --selection context_map
